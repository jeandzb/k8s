  # 5，其他节点加入集群(非master control的其他节点)
  
  ### 5.1，安装kubeadm kubelet
    
    node节点不需要安装kubectl
    `yum install -y kubeadm kubelet`

  ### 5.2，加入集群

  - 加入集群前确定/etc/containerd/config.toml中的配置正确，可直接拷贝master的此配置文件
    
    `scp master:/etc/containerd/config.toml /etc/containerd/config.toml`
    重启containerd
    `systemctl restart containerd`
    kubelet加入开机启动，不执行此步骤，加入集群时会出现告警
    `systemctl enable kubelet`
    执行加入集群
    `kubeadm join 192.168.100.100:6443 --token 13xv66.blb9bllamoquemm2 --discovery-token-ca-cert-hash sha256:2a71c2503c386557f5f5c65af5aca611d7176d43a7fb26e0c58b0b164855768a`
    
    令牌丢失，重新生成
    `kubeadm token create --print-join-command`

  - 如果加入集群失败，执行 kubeadm reset 重置后，重新加入集群
  
  ## 问题：
    
    master节点在加入集群后，执行kubectl get node 报错：
    ![925e771d0ed5afcb388295acb718476b.png](925e771d0ed5afcb388295acb718476b.png)
    
    1,在用户目录创建： mkdir ~/.kube
    2,复制配置文件：cp /etc/kubernetes/kubelet.conf ~/.kube/config
    3,重新登录即可
  
  ### 5.3，查看集群
    
    在master节点执行：
    `kubectl get node`
    ![d54f4247f1a135dc270395d02510408d.png](d54f4247f1a135dc270395d02510408d.png)
    `kubectl get nodes -o wide`
    ![40107f0c6bdcc081ba48efaa6cb46763.png](40107f0c6bdcc081ba48efaa6cb46763.png)
    `kubectl get pod -o wide -A`
    ![06eefd7ac53b44a7039dc67b9f674aa1.png](06eefd7ac53b44a7039dc67b9f674aa1.png)
    `kubectl get service -A`
    ![f5d00488fbc99a953f7728bf0f2660d4.png](f5d00488fbc99a953f7728bf0f2660d4.png)
    `kubectl get configmaps -A`
    ![6e8e242b197b0a343256240fe9b5e39c.png](6e8e242b197b0a343256240fe9b5e39c.png)
    
    设置节点角色：
    Roles为none
    ![d5867b5f4abd33e47b2b5c2b3f9e5ae6.png](d5867b5f4abd33e47b2b5c2b3f9e5ae6.png)
    设置角色
    `kubectl label nodes woker01 node-role.kubernetes.io/worker=""`
    命令解析：
    node-role.kubernetes.io/worker=""

  - 这是要添加到节点的标签。标签由键（node-role.kubernetes.io/worker）和值（""）组成。
  - 标签键（node-role.kubernetes.io/worker）：表示该节点是 Worker 节点。这个标签键是一个标准的 Kubernetes 标签键，用于标识节点的角色。
  - 标签值（""）：值为空字符串。在 Kubernetes 中，标签的值通常可以是任意字符串，但有时为了简洁和统一，值可以为空。空值只是为了确保标签键存在。
    
    所以，其实就是给对应节点一个新的标签
    ![d9689df16ac89c67aba17e286868e0d9.png](d9689df16ac89c67aba17e286868e0d9.png)
    ![d41752a8e44d52fc80e6dec9b4af1835.png](d41752a8e44d52fc80e6dec9b4af1835.png)
  
