# 1 、集群基础环境准备（所有节点）

  ==部署架构：==
    
    | 系统  | IP  | hostname |
    | --- | --- | --- |
    | Rocky linux 9.4 | 192.168.100.100 | master |
    | Rocky linux 9.4 | 192.168.100.101 | woker01 |
    | Rocky linux 9.4 | 192.168.100.102 | woker02 |
    | Rocky linux 9.4 | 192.168.100.103 | woker03 |
  
  ### 1.1 设置节点为静态IP
    
    `nmtui`
  
  ### 1.2 关闭selinux
    
    `sudo sed -i 's/^SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config`
    此项修改后需要重启系统
  
  ### 1.3 配置节点主机名
    
    `hostnamectl set-hostname master/woker01/...`
  
  ### 1.4 配置主机hosts文件，相互之间通过主机名互相访问
    
    ```bash
    cat >> /etc/hosts << EOF
    192.168.100.100 master
    192.168.100.101 woker01
    192.168.100.102 woker02
    192.168.100.103 woker03
    EOF
    ```
  
  ### 1.5 配置主机之间无密码登录
    
    生成密钥
    `ssh-keygen`
    发送密钥
    `ssh-copy-id -i .ssh/id_rsa.pub master/woker01/...`
  
  ### 1.6 关闭交换分区swap
    
    `sudo sed -i '/ swap / s/^(.\*)$/#\\1/g' /etc/fstab`
  
  ### 1.7 修改机器内核参数
    
    ```bash
    cat >> /etc/sysctl.d/k8s.conf << EOF
  #禁用swap分区  
    vm.swappiness=0
  #启用ipv6和ipv4桥接的流量走防火墙  
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
  #启用IPV4转发功能  
    net.ipv4.ip_forward = 1
    EOF
    ```
    
    加载网桥过滤模块
    
    ```bash
    cat <<EOF | tee /etc/modules-load.d/k8s.conf
    overlay
    br_netfilter
    EOF
    ```
    
    加载模块
    
    ```bash
    modprobe overlay
    modprobe br_netfilter
    ```
    
    重载配置
    `sysctl --system`
    查询
    `lsmod | grep br_netfilter`
    
    ![329fba26a719ddf2f78c034bf54f7da9.png](329fba26a719ddf2f78c034bf54f7da9.png)
  
  ### 1.8 关闭firewalld防火墙
    
    `systemctl stop firewalld && systemctl disable firewalld`
  
  ### 1.9 配置k8s的repo源
    
    阿里云：
    
    ```bash
    cat > /etc/yum.repos.d/kubernetes.repo  << EOF
  [kubernetes]
    name=Kubernetes
    baseurl=https://mirrors.aliyun.com/kubernetes-new/core/stable/v1.31/rpm/
    enabled=1
    gpgcheck=1
    gpgkey=https://mirrors.aliyun.com/kubernetes-new/core/stable/v1.31/rpm/repodata/repomd.xml.key
    EOF
    ```

  - 注意上面的版本号，打开https://mirrors.aliyun.com/kubernetes-new/core/stable 链接可查看有哪些版本，根据情况选择
    
    清理缓存，重新加载缓存
    
    ```bash
    yum clean all && \
    yum makecache
    ```
  
  ### 1.10 配置时间同步
    
    ```bash
    cat >> /etc/chrony.conf << EOF
    pool ntp1.aliyun.com iburst
    pool ntp2.aliyun.com iburst
    pool cn.pool.ntp.org iburst
    EOF
    ```

  - 如果没有此配置文件，需要安装
    
    ```bash
    dnf install chrony -y
    systemctl enable --now chronyd && systemctl restart chronyd
    ```

  ### 1.11 配置IPVS

  - K8S默认使用iptables，IPVS有更高级和丰富的功能，此步骤根据实际需求执行
    
    安装IPVS
    `dnf install ipset ipvsadm -y`
    添加IPVS参数
    
    ```bash
    cat <<EOF | sudo tee /etc/modules-load.d/ipvs.conf
    overlay
    ip_vs
    ip_vs_rr
    ip_vs_wrr
    ip_vs_sh
    nf_conntrack
    EOF
    ```
    
    手动加载模块
    
    ```bash
    modprobe overlay
    modprobe ip_vs && modprobe ip_vs_rr && modprobe ip_vs_wrr && modprobe ip_vs_sh && modprobe nf_conntrack
    ```

  - 查询是否加载成功，否则还是会使用iptables
    
    `lsmod | grep -e ip_vs -e nf_conntrack_ipv4`
    
    ![c88595dcdbedf398a803765cc7d89ca4.png](c88595dcdbedf398a803765cc7d89ca4.png)
  
  # 2、安装container（所有节点执行）
    
    3种方式：
  
  ### 2.1，在线安装
    
    待测试
  
  ### 2.2，rpm安装：
    
    在此路径下载rpm包 ，注意版本
    https://download.docker.com/linux/rhel/9/x86_64/stable/Packages/
    `yum localinstall rpm包`
    
    添加开机启动并启动containerd服务
    
    ```bash
    systemctl enable containerd
    systemctl start containerd
    systemctl status containerd
    ```
  
  ### 2.3，二进制安装：
    
    此链接下载tar包：
    https://github.com/containerd/containerd/releases
    
    ```bash
    wget -c https://github.com/containerd/containerd/releases/download/v1.7.11/containerd-1.7.11-linux-amd64.tar.gz
    tar -xzvf containerd-1.7.11-linux-amd64.tar.gz
    ```
    
    解压出来一个bin目录,containerd可执行文件都在bin目录里面
    
    ```bash
    mv bin/* /usr/local/bin/
    rm -rf bin
    ```
    
    使用systemcd来管理containerd
    
    ```bash
    wget https://raw.githubusercontent.com/containerd/containerd/main/containerd.service
    mv containerd.service /usr/lib/systemd/system/
    systemctl daemon-reload && systemctl enable --now containerd
    systemctl status containerd
    ```

  - 二进制安装的如果没有生成配置文件，需要手动生成
  - 修改containerd的配置，因为containerd默认从k8s官网拉取镜像
    
    创建一个目录用于存放containerd的配置文件
    `mkdir -p /etc/containerd`
    把containerd配置导出到文件
    `containerd config default | sudo tee /etc/containerd/config.toml`

  ### 2.4，配置containerd

  - 这里建议使用上面2.3步骤中的containerd config生成配置文件
    
    即：
    `containerd config default | sudo tee /etc/containerd/config.toml`
    编辑/etc/containerd/config.toml，==添加或修改==如下2项内容：
    sandbox_image = "registry.aliyuncs.com/google_containers/pause:3.8"
    SystemdCgroup = true

  - 注意上面/pause:3.8的版本号，需要根据后面kubeadm安装后的实际版本后修改此版本号
    
    重启containerd服务
    
    ```bash
    systemctl enable containerd
    systemctl restart containerd
    ```
  
  # 3，初始化集群（仅master）
  
  ### 3.1，安装kubelet kubeadm kubectl
    
    查看可安装版本：
    yum list available kubeadm --showduplicates
    出现的版本基于上面配置的k8s的yum源的版本
    
    安装指定版本：
    yum install kubeadm-1.27.4
    yum install -y kubelet-1.27.4
    yum install -y kubectl-1.27.4
    
    `dnf install -y kubelet kubeadm kubectl`
    设置kubectl开机启动
    `systemctl enable kubelet`

  - 安装完成后，kubelet是无法启动的，需要初始化，初始化过程中会启动kubelet
  
  #命令补全：  
    `yum install -y bash-completion`
    `kubeadm completion bash > /etc/bash_completion.d/kubeadm`
    `kubectl completion bash > /etc/bash_completion.d/kubectl`
    `source /etc/bash_completion.d/kubeadm /etc/bash_completion.d/kubect`
    
    查看版本：
    
    ```bash
    kubectl version
    yum info kubeadm
    ```
  
  ### 3.2，kubelet配置
    
    查看初始化需要安装的镜像，注意版本和镜像地址
    `kubeadm config images list --kubernetes-version=1.31.0 --image-repository=registry.aliyuncs.com/google_containers`
    ![0fe2f77234b2c24973ea6efec7a65bc9.png](0fe2f77234b2c24973ea6efec7a65bc9.png)

  - 注意上面箭头中的==pause版本号==，需要修改上面container配置中的对应版本号
    
    配置从指定的仓库拉取镜像：
    `kubeadm config images pull --kubernetes-version=1.31.0 --image-repository=registry.aliyuncs.com/google_containers`
  
  ### 3.3，执行初始化：
    
    有两种方式初始化集群
  
  #### 3.3.1，通过 kubeadm init （此方法待测试）
    
    ```bash
    kubeadm init
    \--apiserver-advertise-address=192.168.100.10
    \--apiserver-bind-port=6443
    \--kubernetes-version=v1.24.3
    \--image-repository=registry.cn-hangzhou.aliyuncs.com/google_containers
    \--service-cidr=10.200.0.0/16
    \--pod-network-cidr=10.100.0.0/16
    \--service-dns-domain=cluster.local
    \--control-plane-endpoint=cluster-endpoint
    \--ignore-preflight-errors=swap
    \--v=5
    ```
  
  #### 3.3.2，通过配置文件，（推荐，文件会根据当前环境生成默认的参数）
    
    生成配置文件：
    `kubeadm config print init-defaults > kubeadm-init.yml`
    简单配置需修改项
    ![cab80d1a6991480fe504c91bd11befbe.png](cab80d1a6991480fe504c91bd11befbe.png)
    
    执行初始化
    `kubeadm init --config=kubeadm-init.yml | tee kubeadm-init.log`
    初始化成功后如下，其中有环境变量配置和其他节点加入集群命令
    ![463bf9fe14ad18bb2ee17c2cc0aaafe6.png](463bf9fe14ad18bb2ee17c2cc0aaafe6.png)
    日志过程解析：

  - \[init\] ：开始初始化集群，动作声明；
  - \[preflight\] ：开始初始化之前的检查工作；
  - \[certs\] ：生成相关的各种证书
  - \[kubeconfig\] ：生成相关的kubeconfig文件
  - \[kubelet-start\]： 生成kubelet的配置文件"/var/lib/kubelet/config.yaml"
  - \[control-plane\] ：使用/etc/kubernetes/manifests目录中的yaml文件创建apiserver、controller-manager、scheduler的静态pod，也称为控制平面
  - \[bootstrap-token\]：生成token记录下来，后边使用kubeadm join往集群中添加节点时会用到
  - \[addons\]： 安装基本插件:CoreDNS, kube-proxy
    
    检查kubelet服务状态，初始化成功一般kubelet就启动成功了
    `systemctl status kubelet`
    
    根据初始化成功提示的内容，配置环境变量
    
    ```
    mkdir -p $HOME/.kube
    sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
    sudo chown $(id -u):$(id -g) $HOME/.kube/config
    ```
  
  #临时生效（退出当前窗口重连环境变量失效）  
    `export KUBECONFIG=/etc/kubernetes/admin.conf`
  #永久生效（推荐）
    
    ```
    echo "export KUBECONFIG=/etc/kubernetes/admin.conf" >> ~/.bash_profile
    source ~/.bash_profile
    ```
    
    令牌丢失，重新生成
    `kubeadm token create --print-join-command`
  
