## 4，必需组件安装

需要安装必需组件socat和conntrack
yum install -y socat conntrack ebtables ipset ipvsadm tar

!!!这里ipvsadm组件必须安装，因为kube-proxy依赖此工具，默认的集群安装配置文件使用的ipvs，如果指定iptables则不需要安装此组件。

## 5，设置时间同步

redhat系列linux系统配置统一的chrony时间服务地址
![650eb8062f954bfebf3355b2a21b015b.png](650eb8062f954bfebf3355b2a21b015b.png)

## 6，创建集群

KKZONE=cn ./kk create cluster -f config-sample.yaml
![39795c22d03fc0374966398e7eebbcb9.png](39795c22d03fc0374966398e7eebbcb9.png)
输入yes开始部署

过程可以看到使用的阿里云镜像仓库
![5ba36a4fbd5078bcc2f4878e36491e4f.png](5ba36a4fbd5078bcc2f4878e36491e4f.png)

==执行初始化的节点，其/etc/kubernetes/kubeadm-config.yaml文件中包含了初始化的配置信息，其他master节点中无此信息。如果此初始化节点不存在了，不影响集群运行，
但是在使用kk 工具添加新节点时会去校验此内容，此时使用kubeadm工具添加节点即可，参照k8s文档中添加节点==

### 4.0之后的版本安装k8s后，还需要安装ks-core才会有控制台

完整命令：（访问外网受限，需要添加后面2/3项参数）

```
helm upgrade --install -n kubesphere-system --create-namespace ks-core https://charts.kubesphere.io/main/ks-core-1.1.3.tgz --debug --wait \
--set global.imageRegistry=swr.cn-southwest-2.myhuaweicloud.com/ks \
--set extension.imageRegistry=swr.cn-southwest-2.myhuaweicloud.com/ks \
--set hostClusterName=host
```

- hostClusterName： 修改主集群的名字，默认为 host
- 两个 imageRegistry：修改组件镜像仓库地址

### 卸载kubesphere

helm -n kubesphere-system uninstall ks-core

## 7，添加节点：

一般情况下，master和woker节点一样
新节点安装必要组件：
`yum install socat conntrack tar ipvsadm -y`
生成配置文件（如果之前安装集群的配置文件没有了）：
`./kk create config --from-cluster`
将新集群的信息添加到配置文件的hosts 和 roleGroups
![8869b0aadf0718415991e6a6c6cae909.png](8869b0aadf0718415991e6a6c6cae909.png)
执行添加集群
`KKZONE=cn ./kk add nodes -f sample.yaml`

## 8，删除节点
1，查看当前所有的节点：
kubectl get node
2，排空需要删除节点的pod：
kubectl drain <node name>
3，基于安装集群的配置文件删除节点
./kk delete node <node name> -f config-sample.yaml

如果配置文件不存在，使用Kubectl delete node <node name>

