![b4f5e8df21ad40ff0e105ef040021cd7.png](b4f5e8df21ad40ff0e105ef040021cd7.png)
或者改为青云官方的阿里镜像仓库
registry.cn-beijing.aliyuncs.com
kubesphereio
![a2789c0ccf46a3ba66f34d110e2cb475.png](a2789c0ccf46a3ba66f34d110e2cb475.png)

