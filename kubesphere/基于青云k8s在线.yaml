==问题3：安装一直卡在 Please wait for the installation to complete:==
![865010a0d7b42f189147c7d49588c6e0.png](865010a0d7b42f189147c7d49588c6e0.png)
此时另外开一个此节点的窗口或者在其他master节点查看安装进度日志：
`kubectl logs -n kubesphere-system $(kubectl get pod -n kubesphere-system -l 'app in (ks-install, ks-installer)' -o jsonpath='{.items[0].metadata.name}') -f`
![79d39ebc6718e8a629c17d0355c6e55a.png](79d39ebc6718e8a629c17d0355c6e55a.png)
查看集群deployment，发现很多失败的
kubectl get deployment --all-namespaces
![3faec2f2c9c22e22e74d2cd4759ab8ad.png](3faec2f2c9c22e22e74d2cd4759ab8ad.png)
查看pod
kubectl get pod -A
![729b575a7dba337993ff28da154552c4.png](729b575a7dba337993ff28da154552c4.png)
查看pod日志
kubectl logs -f --tail 100 podname
发现是镜像拉取失败

此时需要修改所有有问题的deployment的镜像地址
kubectl edit deployment ks-console -n kubesphere-system
修改完后会自动执行更新

或者直接更改docker或者container的镜像仓库加速地址

