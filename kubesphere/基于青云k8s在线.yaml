## 1，下载安装工具

- 根据官网文档的无法下载：
    export KKZONE=cn
    curl -sfL https://get-kk.kubesphere.io | VERSION=v3.0.13 sh -
    直接打开链接：https://get-kk.kubesphere.io
    会自动下载脚本：downloadKubekey.sh
    根据脚本的下载链接，组合成下图中红框的链接，在能访问git的节点下载文件，上传至集群master节点。
    ![695d37d0c31c1541897c9d16f86ee1bc.png](695d37d0c31c1541897c9d16f86ee1bc.png)
- 或者直接访问此链接下载kubekey
    https://github.com/kubesphere/kubekey

## 2，生成配置文件

- 查看当前kk支持的k8s版本
    ./kk version --show-supported-k8s
- 生成配置文件
    ./kk create config --with-kubernetes v1.26.3 --with-kubesphere v3.4.1
    后面的参数指定对应的版本，需要提前了解kk每个版本支持的版本矩阵

## 3，编辑配置文件

其中的hosts.name，就是集群安装完成后，每个节点的hostname，安装过程中会自动设置每个节点。

简单安装只需要关注集群节点的基础信息即可
![2302dbeef18cd45a43ce7074521bb0e4.png](2302dbeef18cd45a43ce7074521bb0e4.png)
